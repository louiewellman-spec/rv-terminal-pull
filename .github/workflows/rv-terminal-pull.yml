# GitHub Actions · RV Terminal headless pull — a self-chaining job, every 15 minutes.
# GitHub's cron is best-effort on the free tier (8-9 Sep 2026: 4 ticks fired in 12 h instead of 48),
# so one job keeps pulling for ~5h35m (headless/loop.sh) and then dispatches its own successor.
# The cron only restarts the chain if it has died; the concurrency group keeps it to one chain.
name: rv-terminal-pull
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: { group: rv-terminal-pull, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: pull every 15 min for ~5h35m
        id: chain
        env:
          STRIPE_KEY:  ${{ secrets.STRIPE_KEY }}
          SB_EMAIL:    ${{ secrets.SB_EMAIL }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          BIN_ID:      ${{ secrets.BIN_ID }}
          BIN_KEY:     ${{ secrets.BIN_KEY }}
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
        # run a COPY: the loop refreshes the checkout every slot, and bash must not have its own
        # script file rewritten underneath it
        run: cp headless/loop.sh /tmp/rv-loop.sh && bash /tmp/rv-loop.sh
      - name: dispatch the next link of the chain
        if: steps.chain.outputs.alive == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run rv-terminal-pull.yml --ref main -R "$GITHUB_REPOSITORY"
